# SHSkins (serveurs Paper) : donne le skin de n'importe quel joueur SkyHand, connecté ou non, aux autres plugins.
# Le proxy (SHSkins Velocity) enregistre dans MariaDB le skin appliqué à chaque connexion ; ce plugin lit toute la
# table au démarrage puis relit les skins modifiés toutes les « rafraichissement-secondes ». Les recherches se font
# en mémoire, sans attendre la base.
#
# Utilisation :
#   Plugins SkyHand    org.Cry_Legende.sHSkins.api.SHSkinsAPI : createHead, applyHead, createProfile, getSkin,
#                      getPieces, makePieces (morceaux d'un skin, pour une statue articulée).
#   Placeholders       %shskins_texture_<pseudo>%  textures du skin en base64 (format de « basehead- » dans DeluxeMenus)
#                      %shskins_url_<pseudo>%      adresse de l'image du skin
#                      %shskins_texture%, %shskins_url% : le joueur qui regarde.
#                      Le pseudo peut venir d'un autre placeholder entre accolades :
#                      material: 'basehead-%shskins_texture_{ajlb_lb_vault_eco_balance_fixed_1_alltime_name}%'
#
# Commandes (en jeu : /shskinsadmin, car /shskins y est celle du proxy ; en console, les deux) :
#   /shskinsadmin info <pseudo>              Skin connu pour ce joueur : adresse de l'image et date où le proxy l'a appliqué.
#   /shskinsadmin morceaux                   Morceaux de skins faits, en cours, et dépôts encore permis.
#   /shskinsadmin morceaux <pseudo>          Ceux d'un joueur : déjà faits, sinon les fait.
#   /shskinsadmin morceaux refaire <pseudo>  Les refait tous (l'un d'eux s'affiche mal).
#   /shskinsadmin compte                     État du compte Mojang qui dépose les morceaux.
#   /shskinsadmin compte connecter           Donne un lien, à ouvrir avec le compte à connecter (un autre compte le remplace).
#   /shskinsadmin compte deconnecter         Retire le compte, MineSkin continue seul.
#   /shskinsadmin reload                     Recharge config.yml et messages.yml ; si un fichier est illisible, la configuration
#                                            précédente reste active. base-de-donnees demande un redémarrage du serveur.
#
# Permissions (op par défaut, shskins.admin les donne toutes) :
#   shskins.admin.info, shskins.admin.morceaux, shskins.admin.compte, shskins.admin.reload
#
# Les messages des commandes sont dans messages.yml.

# Base MariaDB où le proxy enregistre les skins (la même que dans la config du proxy). Lecture seule ici, sauf les
# morceaux de skins.
base-de-donnees:
  url: "jdbc:mariadb://127.0.0.1:3306/minecraft"
  utilisateur: "shskins"
  mot-de-passe: "CHANGE_ME"

# Secondes entre deux relectures des skins modifiés en base (minimum 5).
rafraichissement-secondes: 30

placeholders:
  # Texte rendu quand le skin du joueur n'est pas connu. Vide : la tête DeluxeMenus garde le skin par défaut.
  inconnu: ""

# Morceaux de skins, pour les statues articulées d'autres plugins (podium des évènements). Un skin est découpé en dix morceaux,
# déposés une seule fois, et seulement quand un plugin le demande. Deux sources déposent en même temps : si l'une s'arrête, l'autre
# continue.
morceaux:
  # false : ce serveur se sert des morceaux déjà faits, sans en faire.
  actif: false
  # Première source : un compte Minecraft Java, à vous. Chaque dépôt change son skin, donc un compte qui ne sert à rien d'autre. Il
  # se connecte une fois, avec /shskinsadmin compte connecter. Son jeton est gardé dans compte-mojang.json : ne jamais le copier
  # ailleurs ni le partager. Si le mot de passe du compte change, il faut le reconnecter.
  compte-mojang:
    # Application Microsoft de la connexion : l'identifiant public du launcher Minecraft, ou celui d'une application Azure à vous
    # (il faut d'abord la faire accepter par Mojang, aka.ms/mce-reviewappid).
    application: "00000000402b5328"
    # Dépôts par minute, 20 au plus. Trop de refus suspendraient le compte : après un refus, pause de 2 min, doublée à chaque fois.
    par-minute: 16
  # Seconde source : MineSkin. Gratuit, 100 dépôts par heure pour l'adresse du serveur, skins du site compris.
  mineskin:
    # Clé, à créer sur account.mineskin.org. Vide : pas de MineSkin.
    cle: ""
    # Dépôts de l'heure toujours laissés aux skins du site ; à garder quand la demande n'est pas urgente ; et quand elle ne fait que
    # pouvoir servir (seulement si le compte Mojang ne marche pas).
    reserve: 20
    reserve-non-urgent: 50
    reserve-plus-tard: 70
