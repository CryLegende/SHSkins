# SHSkins : applique le skin SkyHand d'un joueur à sa connexion (plugin du proxy Velocity).
# Ordre : le skin envoyé sur le site (skin-api, généré par MineSkin avec la cape choisie sur le profil), sinon le skin
# du compte Minecraft du même pseudo, sinon le dernier skin enregistré.
#
# Le skin appliqué est enregistré à chaque connexion dans MariaDB (table shskins_skins) : SHSkins sur les serveurs
# Paper le lit pour afficher les têtes, PNJ et menus des joueurs hors ligne. Le même jar sert aux deux.
#
# Commandes :
#   /skin (alias /skins)    Renvoie vers la page du site où changer de skin. Ouverte à tous.
#   /shskins reload         Recharge config.yml et messages.yml ; si un fichier est illisible, la configuration
#                           précédente reste active. Vide aussi le cache mémoire des skins et relit les capes
#                           MineSkin. base-de-donnees demande un redémarrage. Marche depuis la console.
#
# Permissions (évaluées par le gestionnaire de permissions du proxy ; sans lui, seule la console y a droit) :
#   shskins.admin.reload    /shskins reload. shskins.admin n'est pas une permission parente sous Velocity : il faut
#                           accorder shskins.admin.reload.
#
# Le texte de /skin et les messages de /shskins sont dans messages.yml.

# URL de l'API pour récupérer les skins des joueurs.
# Utilisez %player% pour le pseudo et %uuid% pour l'UUID du joueur.
api-url: "https://example.com/api/skin-api/skins/%player%"

# URL du choix de cape fait sur le site (carte « Ma cape » du profil), même syntaxe que api-url.
# Réponse JSON {"cape": "auto"} : "auto" = la cape du compte Minecraft du même pseudo, "none" = aucune,
# sinon l'UUID d'une cape MineSkin (https://api.mineskin.org/v2/capes). Vide : toujours "auto".
# MineSkin ne pose une cape sur un skin du site qu'avec une offre payante (Basic et au-dessus) :
# avec une clé gratuite, seuls les joueurs sans skin du site gardent la cape de leur compte.
cape-api-url: "https://example.com/api/cape/%player%"

# Configuration du cache pour les skins
cache:
  # Activer ou désactiver le cache des skins. Recommandé : true
  enabled: true
  # Durée de vie d'un skin dans le cache (en minutes) avant de le rafraîchir.
  expire-after-write-minutes: 30
  # Nombre maximum de skins à conserver en mémoire.
  maximum-size: 1000

# Configuration de l'API MineSkin (https://mineskin.org)
mineskin:
  # Votre clé d'API MineSkin (peut être laissée vide si vous n'en avez pas).
  # Requis pour générer des skins à partir d'URLs.
  api-key: "CHANGE_ME"

# Base MariaDB : skin appliqué à chaque joueur et dernière réponse de Mojang pour son pseudo (schema.sql du dépôt).
# Changer ces valeurs demande un redémarrage du proxy.
base-de-donnees:
  url: "jdbc:mariadb://127.0.0.1:3306/minecraft"
  utilisateur: "shskins"
  mot-de-passe: "CHANGE_ME"

# Activer les messages de débogage dans la console.
debug: false
